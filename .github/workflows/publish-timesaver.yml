name: Publish TIMESAVER release
run-name: Publish TIMESAVER release

on:
  pull_request:
    paths:
      - .github/workflows/publish-timesaver.yml
      - docs/RELEASE_AUTOMATION.md
      - scripts/resolve_timesaver_release_request.py
      - scripts/timesaver_release_assets.py
      - scripts/timesaver_release_draft.py
      - tests/test_timesaver_release_request.py
      - release-requests/timesaver/**
  push:
    branches: [main]
    paths:
      - release-requests/timesaver/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        type: string
        required: true
        default: "1.1.6"
      source_repository:
        description: Private source repository containing the candidate artifact
        type: string
        required: true
        default: "knowtodo/timesaver"
      source_run_id:
        description: Successful Actions run ID that uploaded the candidate
        type: string
        required: true
        default: "42489954978"
      artifact_name:
        description: Candidate artifact name
        type: string
        required: true
        default: "TIMESAVER-1.1.6-RELEASE-CANDIDATE"
      expected_source_commit:
        description: Exact source commit recorded in the candidate manifest
        type: string
        required: true
        default: "1fab21d2af15b3b5dd8f247ff0376cf59f3fef96"
      expected_zip_sha256:
        description: Expected SHA-256 of the actual release ZIP
        type: string
        required: true
        default: "C78E1A8FC2546A40327C701E8E6DDB461DC679A322AD900EAA741405B1808B2D"
      expected_exe_sha256:
        description: Expected SHA-256 of TIMESAVER.exe
        type: string
        required: true
        default: "FC0E418D431D753A3C920199F61868B63B74003CFBAA44A5A9794D905820F333"
      expected_updater_sha256:
        description: Expected SHA-256 of the shared Updater.exe
        type: string
        required: true
        default: "CEB28ED1E8DFDE50FD1BD8511DE9D05900D4F3C98339AA2D55CEFBC6F49CD498"
      expected_repair_sha256:
        description: Optional expected SHA-256 of the standalone repair tool
        type: string
        required: false
        default: ""
      expected_repair_bytes:
        description: Optional expected byte size of the standalone repair tool
        type: string
        required: false
        default: ""
      release_notes:
        description: Public Release notes
        type: string
        required: true
        default: |-
          [변경사항]
          - 구직촉진수당 상담일지에 가족수당 확인 기능 추가
          - 가족수당 대상자 및 금액 선택 기능 추가
          - 가족수당 금액 단일 선택 오류 수정
          - 취업예정 기업명 및 취업예정일 입력 개선
          - IAP 1유형에 소득·가족수당·취업예정 확인 기능 추가
          - 입력 내용에 따른 상담일지 자동 문구 생성 개선

permissions:
  contents: write

concurrency:
  group: timesaver-release-publisher
  cancel-in-progress: false

jobs:
  validate_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout proposed workflow
        uses: actions/checkout@v4
      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow gates and release request tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          import yaml
          from pathlib import Path

          workflow_path = Path(".github/workflows/publish-timesaver.yml")
          source = workflow_path.read_text(encoding="utf-8")
          data = yaml.safe_load(source)
          triggers = data.get("on", data.get(True, {}))
          assert "pull_request" in triggers and "workflow_dispatch" in triggers and "push" in triggers
          assert triggers["push"]["branches"] == ["main"]
          assert triggers["push"]["paths"] == ["release-requests/timesaver/**"]
          assert "release-requests/timesaver/**" in triggers["pull_request"]["paths"]
          publish = data["jobs"]["publish"]
          assert "workflow_dispatch" in publish["if"] and "push" in publish["if"]
          assert "refs/heads/main" in publish["if"] and "pull_request" not in publish["if"]
          assert data["permissions"]["contents"] == "write"
          assert Path("scripts/resolve_timesaver_release_request.py").is_file()
          assert Path("scripts/timesaver_release_draft.py").is_file()
          draft_helper = Path("scripts/timesaver_release_draft.py").read_text(encoding="utf-8")
          assert "def resolve_release" in draft_helper and "MAX_RELEASE_GET_ATTEMPTS = 3" in draft_helper
          assert "releases?per_page=100" in draft_helper
          assert "POST exactly once" in draft_helper
          assert source.index("Reject an already-published") < source.index("Download private source candidate artifact")
          assert source.index("Download private source candidate artifact") < source.index("Create or safely reuse draft Release and assets")
          assert source.index("Public ZIP SHA-256 mismatch") < source.index("Update or verify update JSON")
          assert "RESOLVED_RETRY_REQUEST" in source and "RESOLVED_RETRY_BASELINE_VERSION" in source
          assert "expected_repair_sha256" in source and "expected_repair_bytes" in source
          helper = Path("scripts/timesaver_release_assets.py").read_text(encoding="utf-8")
          assert "validate_candidate_file_set" in source and "verify_file" in source
          assert "release_asset_upload_plan" in helper and "reject_unexpected" in helper
          assert "--require-all" in source and "plan_args+=(--repair-name" in source
          assert 'verify_public_asset "$REPAIR_ASSET_NAME"' in source
          assert 'run.get("path") != ".github/workflows/test-windows-isolated.yml"' in source
          assert "VERSION_AND_PATCH_NOTES.txt" in source
          assert "verify_version_notes" in source and "parse_sha256_manifest" in source
          assert "ZIP_MEMBERS=TIMESAVER.exe,Updater.exe" in source
          assert "release-requests/timesaver/retries" in source
          release_start = source.index("      - name: Create or safely reuse draft Release and assets\n")
          json_start = source.index("      - name: Update or verify update JSON after public ZIP validation\n")
          assert source.index('verify_public_asset "$REPAIR_ASSET_NAME"') < json_start
          release_logic = source[release_start:json_start]
          assert "timesaver_release_draft.py resolve" in release_logic
          assert 'URL="https://github.com/$RELEASE_REPOSITORY/releases/download/$TAG/$ASSET"' in release_logic
          assert "releases/$RELEASE_ID" in release_logic
          assert "gh release create" not in release_logic
          assert "git/ref/tags/$TAG" in release_logic and "validate-tag-ref" in release_logic
          assert "timesaver_release_assets.py" in release_logic and "--require-all" in release_logic
          assert "releases/assets/$asset_id" in release_logic and "uploads.github.com" in release_logic
          assert "releases/assets/$asset_id" in source
          assert "uploads.github.com" in source and "--data-binary \"@$upload_path\"" in source
          assert "application/zip" in release_logic and "application/octet-stream" in release_logic
          assert "gh release upload \"$TAG\"" not in source and "gh release download \"$TAG\"" not in source
          assert "update JSON remains unchanged" in release_logic
          print("WORKFLOW_TRIGGERS_AND_RELEASE_GATES=PASS")
          PY
          python -m unittest discover -s tests -p "test_timesaver_release_request.py" -v
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: knowtodo/do-with-joy-releases
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python for request validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dispatch inputs or the new release request
        id: release_request
        shell: bash
        env:
          REQUEST_EVENT_NAME: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_BEFORE: ${{ github.event.before }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          DISPATCH_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          DISPATCH_EXPECTED_ZIP_SHA256: ${{ inputs.expected_zip_sha256 }}
          DISPATCH_EXPECTED_EXE_SHA256: ${{ inputs.expected_exe_sha256 }}
          DISPATCH_EXPECTED_UPDATER_SHA256: ${{ inputs.expected_updater_sha256 }}
          DISPATCH_RELEASE_NOTES: ${{ inputs.release_notes }}
          DISPATCH_EXPECTED_REPAIR_SHA256: ${{ inputs.expected_repair_sha256 }}
          DISPATCH_EXPECTED_REPAIR_BYTES: ${{ inputs.expected_repair_bytes }}
        run: python scripts/resolve_timesaver_release_request.py
      - name: Validate request and required source-read secret
        shell: bash
        env:
          VERSION: ${{ steps.release_request.outputs.version }}
          SOURCE_REPOSITORY: ${{ steps.release_request.outputs.source_repository }}
          SOURCE_RUN_ID: ${{ steps.release_request.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.release_request.outputs.artifact_name }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.release_request.outputs.expected_source_commit }}
          EXPECTED_ZIP_SHA256: ${{ steps.release_request.outputs.expected_zip_sha256 }}
          EXPECTED_EXE_SHA256: ${{ steps.release_request.outputs.expected_exe_sha256 }}
          EXPECTED_UPDATER_SHA256: ${{ steps.release_request.outputs.expected_updater_sha256 }}
          EXPECTED_REPAIR_SHA256: ${{ steps.release_request.outputs.expected_repair_sha256 }}
          EXPECTED_REPAIR_BYTES: ${{ steps.release_request.outputs.expected_repair_bytes }}
          SOURCE_READ_TOKEN: ${{ secrets.TIMESAVER_SOURCE_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id must contain digits only"; exit 1; }
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::expected_source_commit must be a full commit SHA"; exit 1; }
          for digest in "$EXPECTED_ZIP_SHA256" "$EXPECTED_EXE_SHA256" "$EXPECTED_UPDATER_SHA256"; do
            [[ "$digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::all expected hashes must be SHA-256 hex"; exit 1; }
          done
          if [[ -n "$EXPECTED_REPAIR_SHA256" || -n "$EXPECTED_REPAIR_BYTES" ]]; then
            [[ "$EXPECTED_REPAIR_SHA256" =~ ^[0-9a-fA-F]{64}$ && "$EXPECTED_REPAIR_BYTES" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::repair tool hash and positive byte size must be provided together"; exit 1;
            }
          fi
          [[ "$SOURCE_REPOSITORY" == "knowtodo/timesaver" ]] || { echo "::error::source_repository is restricted to knowtodo/timesaver"; exit 1; }
          [[ -n "$SOURCE_READ_TOKEN" ]] || { echo "::error::Configure repository secret TIMESAVER_SOURCE_ARTIFACT_READ_TOKEN before running this workflow"; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo "::error::GitHub Actions did not provide GITHUB_TOKEN"; exit 1; }
          [[ "$ARTIFACT_NAME" == "TIMESAVER-$VERSION-RELEASE-CANDIDATE" ]] || { echo "::error::artifact name must match TIMESAVER-{version}-RELEASE-CANDIDATE"; exit 1; }
          echo "Validated release request for TIMESAVER $VERSION."
      - name: Reject an already-published or downgraded version before release changes
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.release_request.outputs.version }}
          RESOLVED_SOURCE_REPOSITORY: ${{ steps.release_request.outputs.source_repository }}
          RESOLVED_SOURCE_RUN_ID: ${{ steps.release_request.outputs.source_run_id }}
          RESOLVED_ARTIFACT_NAME: ${{ steps.release_request.outputs.artifact_name }}
          RESOLVED_EXPECTED_SOURCE_COMMIT: ${{ steps.release_request.outputs.expected_source_commit }}
          RESOLVED_EXPECTED_ZIP_SHA256: ${{ steps.release_request.outputs.expected_zip_sha256 }}
          RESOLVED_EXPECTED_EXE_SHA256: ${{ steps.release_request.outputs.expected_exe_sha256 }}
          RESOLVED_EXPECTED_UPDATER_SHA256: ${{ steps.release_request.outputs.expected_updater_sha256 }}
          RESOLVED_EXPECTED_REPAIR_SHA256: ${{ steps.release_request.outputs.expected_repair_sha256 }}
          RESOLVED_EXPECTED_REPAIR_BYTES: ${{ steps.release_request.outputs.expected_repair_bytes }}
          RESOLVED_RELEASE_NOTES: ${{ steps.release_request.outputs.release_notes }}
          RESOLVED_RETRY_REQUEST: ${{ steps.release_request.outputs.retry_request }}
          RESOLVED_RETRY_BASELINE_VERSION: ${{ steps.release_request.outputs.retry_baseline_version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/$RELEASE_REPOSITORY/main/TIMESAVER_update.json" --output current-public-json.json
          python scripts/resolve_timesaver_release_request.py --check-public-version current-public-json.json
      - name: Download private source candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.release_request.outputs.artifact_name }}
          path: incoming
          repository: ${{ steps.release_request.outputs.source_repository }}
          run-id: ${{ steps.release_request.outputs.source_run_id }}
          github-token: ${{ secrets.TIMESAVER_SOURCE_ARTIFACT_READ_TOKEN }}
      - name: Validate source run, artifact manifest, ZIP entries, and hashes
        id: candidate
        shell: bash
        env:
          VERSION: ${{ steps.release_request.outputs.version }}
          SOURCE_REPOSITORY: ${{ steps.release_request.outputs.source_repository }}
          SOURCE_RUN_ID: ${{ steps.release_request.outputs.source_run_id }}
          SOURCE_READ_TOKEN: ${{ secrets.TIMESAVER_SOURCE_ARTIFACT_READ_TOKEN }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.release_request.outputs.expected_source_commit }}
          EXPECTED_ZIP_SHA256: ${{ steps.release_request.outputs.expected_zip_sha256 }}
          EXPECTED_EXE_SHA256: ${{ steps.release_request.outputs.expected_exe_sha256 }}
          EXPECTED_UPDATER_SHA256: ${{ steps.release_request.outputs.expected_updater_sha256 }}
          EXPECTED_REPAIR_SHA256: ${{ steps.release_request.outputs.expected_repair_sha256 }}
          EXPECTED_REPAIR_BYTES: ${{ steps.release_request.outputs.expected_repair_bytes }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path
          from scripts.timesaver_release_assets import (
              AssetValidationError,
              REPAIR_ASSET_NAME,
              expected_candidate_file_names,
              parse_optional_repair_expectations,
              parse_sha256_manifest,
              validate_candidate_file_set,
              verify_file,
              verify_version_notes,
          )

          def stop(message):
              raise SystemExit(message)

          version = os.environ["VERSION"]
          run_id = os.environ["SOURCE_RUN_ID"]
          source_repo = os.environ["SOURCE_REPOSITORY"]
          token = os.environ["SOURCE_READ_TOKEN"]
          expected_source = os.environ["EXPECTED_SOURCE_COMMIT"].lower()
          expected_zip = os.environ["EXPECTED_ZIP_SHA256"].lower()
          expected_exe = os.environ["EXPECTED_EXE_SHA256"].lower()
          expected_updater = os.environ["EXPECTED_UPDATER_SHA256"].lower()

          request = urllib.request.Request(
              f"https://api.github.com/repos/{source_repo}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "timesaver-release-publisher",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
          except urllib.error.HTTPError as exc:
              stop(f"Source run metadata request failed with HTTP {exc.code}.")
          except Exception as exc:
              stop(f"Source run metadata request failed ({type(exc).__name__}).")

          if str(run.get("id")) != run_id:
              stop("The source run ID returned by GitHub does not match the requested run.")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              stop("The selected source run is not completed successfully.")
          if run.get("path") != ".github/workflows/test-windows-isolated.yml":
              stop("The source run did not use the approved Windows candidate-validation workflow.")
          if run.get("event") not in {"push", "pull_request"}:
              stop("The source run event is not an approved candidate-validation event.")
          head_repo = (run.get("head_repository") or {}).get("full_name")
          if head_repo != source_repo:
              stop("The source run belongs to a different repository.")
          if (run.get("head_sha") or "").lower() != expected_source:
              stop("The source run commit does not match expected_source_commit.")

          root = Path("incoming")
          try:
              repair_expectations = parse_optional_repair_expectations(
                  os.environ.get("EXPECTED_REPAIR_SHA256", ""),
                  os.environ.get("EXPECTED_REPAIR_BYTES", ""),
              )
              expected_outer = expected_candidate_file_names(version, repair_expectations is not None)
              candidate_files = validate_candidate_file_set(root, expected_outer)
          except AssetValidationError as exc:
              stop(str(exc))

          try:
              notes_sha256 = verify_version_notes(
                  candidate_files["VERSION_AND_PATCH_NOTES.txt"],
                  version,
              )
          except AssetValidationError as exc:
              stop(str(exc))

          zip_path = root / f"TIMESAVER-{version}.zip"
          zip_hash = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          if zip_hash != expected_zip:
              stop(f"ZIP SHA-256 mismatch: got {zip_hash}.")

          with zipfile.ZipFile(zip_path) as archive:
              names = [info.filename for info in archive.infolist() if not info.is_dir()]
              if len(names) != 2 or set(names) != {"TIMESAVER.exe", "Updater.exe"}:
                  stop(f"ZIP must contain only TIMESAVER.exe and Updater.exe; got {names}.")
              if any("/" in name or "\\" in name or name.startswith(".") for name in names):
                  stop("ZIP members must be at the archive root.")
              bad_member = archive.testzip()
              if bad_member is not None:
                  stop(f"ZIP CRC validation failed for {bad_member}.")
              exe_hash = hashlib.sha256(archive.read("TIMESAVER.exe")).hexdigest()
              updater_hash = hashlib.sha256(archive.read("Updater.exe")).hexdigest()
              if exe_hash != expected_exe or updater_hash != expected_updater:
                  stop("An executable hash inside the ZIP does not match the approved value.")
          repair_path = ""
          repair_hash = ""
          repair_bytes = ""
          if repair_expectations is not None:
              expected_repair_hash, expected_repair_bytes = repair_expectations
              repair_path = candidate_files[REPAIR_ASSET_NAME]
              try:
                  actual_repair_hash = verify_file(
                      repair_path,
                      expected_repair_hash,
                      expected_repair_bytes,
                      REPAIR_ASSET_NAME,
                  )
              except AssetValidationError as exc:
                  stop(str(exc))
              repair_hash = actual_repair_hash
              repair_bytes = str(expected_repair_bytes)

          expected_sums = {
              f"TIMESAVER-{version}.zip": expected_zip,
              "TIMESAVER.exe": expected_exe,
              "Updater.exe": expected_updater,
              "VERSION_AND_PATCH_NOTES.txt": notes_sha256,
          }
          if repair_hash:
              expected_sums[REPAIR_ASSET_NAME] = repair_hash
          try:
              sums = parse_sha256_manifest(root / "SHA256SUMS.txt")
          except AssetValidationError as exc:
              stop(str(exc))
          if sums != expected_sums:
              stop("SHA256SUMS.txt does not exactly match every verified candidate file.")

          out_path = zip_path.resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"zip_path={out_path}\n")
              output.write(f"zip_sha256={zip_hash}\n")
              output.write(f"zip_bytes={zip_path.stat().st_size}\n")
              output.write(f"repair_path={repair_path}\n")
              output.write(f"repair_sha256={repair_hash}\n")
              output.write(f"repair_bytes={repair_bytes}\n")
          print(f"Candidate verified: run={run_id}, source={expected_source}")
          print(f"ZIP_BYTES={zip_path.stat().st_size}")
          print(f"ZIP_SHA256={zip_hash}")
          print(f"EXE_SHA256={exe_hash}")
          print(f"UPDATER_SHA256={updater_hash}")
          print("ZIP_MEMBERS=TIMESAVER.exe,Updater.exe")
          if repair_hash:
              print(f"REPAIR_EXE_BYTES={repair_bytes}")
              print(f"REPAIR_EXE_SHA256={repair_hash}")
          PY
      - name: Create or safely reuse draft Release and assets
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.release_request.outputs.version }}
          RELEASE_NOTES: ${{ steps.release_request.outputs.release_notes }}
          ZIP_PATH: ${{ steps.candidate.outputs.zip_path }}
          ZIP_BYTES: ${{ steps.candidate.outputs.zip_bytes }}
          REPAIR_ASSET_PATH: ${{ steps.candidate.outputs.repair_path }}
          REPAIR_ASSET_NAME: TIMESAVER_Update_Repair.exe
          REPAIR_BYTES: ${{ steps.candidate.outputs.repair_bytes }}
          EXPECTED_ZIP_SHA256: ${{ steps.release_request.outputs.expected_zip_sha256 }}
          EXPECTED_EXE_SHA256: ${{ steps.release_request.outputs.expected_exe_sha256 }}
          EXPECTED_UPDATER_SHA256: ${{ steps.release_request.outputs.expected_updater_sha256 }}
          EXPECTED_REPAIR_SHA256: ${{ steps.release_request.outputs.expected_repair_sha256 }}
        run: |
          set -euo pipefail
          TAG="timesaver-v$VERSION"
          ASSET="TIMESAVER-$VERSION.zip"
          URL="https://github.com/$RELEASE_REPOSITORY/releases/download/$TAG/$ASSET"
          TITLE="TIMESAVER $VERSION"

          python scripts/timesaver_release_draft.py resolve \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$TAG" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --output release.json
          RELEASE_ID="$(jq -er '.id | select(type == "number" and . > 0)' release.json)"
          DRAFT="$(jq -r .draft release.json)"
          REPAIR_ENABLED="false"
          if [[ -n "$EXPECTED_REPAIR_SHA256" ]]; then
            [[ -n "$REPAIR_ASSET_PATH" && "$REPAIR_ASSET_NAME" == "TIMESAVER_Update_Repair.exe" ]] || {
              echo "::error::Repair asset path or name is missing; refusing Release changes."; exit 1;
            }
            [[ "$REPAIR_BYTES" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Repair asset byte size is invalid; refusing Release changes."; exit 1;
            }
            REPAIR_ENABLED="true"
          elif [[ -n "$REPAIR_ASSET_PATH" || -n "$REPAIR_BYTES" ]]; then
            echo "::error::Unexpected repair candidate output without approved request fields."; exit 1
          fi

          plan_args=(
            plan
            --release-json release.json
            --zip-name "$ASSET"
            --zip-bytes "$ZIP_BYTES"
          )
          if [[ "$REPAIR_ENABLED" == "true" ]]; then
            plan_args+=(--repair-name "$REPAIR_ASSET_NAME" --repair-bytes "$REPAIR_BYTES" --strict)
          fi
          python scripts/timesaver_release_assets.py "${plan_args[@]}" > missing-assets.txt

          while IFS= read -r asset_to_upload; do
            [[ -n "$asset_to_upload" ]] || continue
            case "$asset_to_upload" in
              "$ASSET")
                upload_path="$ZIP_PATH"
                content_type="application/zip"
                ;;
              "$REPAIR_ASSET_NAME")
                [[ "$REPAIR_ENABLED" == "true" ]] || {
                  echo "::error::Unapproved repair asset upload was requested."; exit 1;
                }
                upload_path="$REPAIR_ASSET_PATH"
                content_type="application/octet-stream"
                ;;
              *)
                echo "::error::Release asset plan contains an unapproved filename."; exit 1
                ;;
            esac
            [[ -f "$upload_path" ]] || { echo "::error::Planned Release asset is missing."; exit 1; }
            UPLOAD_URL="https://uploads.github.com/repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset_to_upload"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: $content_type" \
              --data-binary "@$upload_path" \
              "$UPLOAD_URL" >/dev/null
          done < missing-assets.txt

          gh api "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID" > release.json
          plan_args+=(--require-all)
          python scripts/timesaver_release_assets.py "${plan_args[@]}" > missing-after-upload.txt
          if [[ -s missing-after-upload.txt ]]; then
            echo "::error::Release is missing one or more required assets after upload."
            exit 1
          fi
          DRAFT="$(jq -r .draft release.json)"

          mkdir -p published-asset
          verify_api_asset() {
            local asset_name="$1"
            local expected_hash="$2"
            local expected_bytes="$3"
            local count asset_id downloaded_path
            count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' release.json)"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one Release asset named $asset_name; refusing modification."
              return 1
            fi
            asset_id="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .id' release.json)"
            downloaded_path="published-asset/$asset_name"
            gh api -H "Accept: application/octet-stream" \
              "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id" > "$downloaded_path"
            python scripts/timesaver_release_assets.py verify \
              "$downloaded_path" "$expected_hash" "$expected_bytes" --label "$asset_name"
          }

          verify_api_asset "$ASSET" "$EXPECTED_ZIP_SHA256" "$ZIP_BYTES"
          if [[ "$REPAIR_ENABLED" == "true" ]]; then
            verify_api_asset "$REPAIR_ASSET_NAME" "$EXPECTED_REPAIR_SHA256" "$REPAIR_BYTES"
          fi
          python - "published-asset/$ASSET" "$EXPECTED_EXE_SHA256" "$EXPECTED_UPDATER_SHA256" <<'PY'
          import hashlib, sys, zipfile
          path, expected_exe, expected_updater = sys.argv[1:]
          with zipfile.ZipFile(path) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
              if len(names) != 2 or set(names) != {"TIMESAVER.exe", "Updater.exe"}:
                  raise SystemExit("Downloaded Release asset has unexpected ZIP entries.")
              if archive.testzip() is not None:
                  raise SystemExit("Downloaded Release asset failed ZIP CRC validation.")
              exe = hashlib.sha256(archive.read("TIMESAVER.exe")).hexdigest()
              updater = hashlib.sha256(archive.read("Updater.exe")).hexdigest()
              if exe != expected_exe.lower() or updater != expected_updater.lower():
                  raise SystemExit("Downloaded Release asset EXE hash mismatch.")
          PY

          if [[ "$DRAFT" == "true" ]]; then
            gh api --method PATCH "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null
          fi
          gh api "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID" > release.json
          if [[ "$(jq -r .draft release.json)" != "false" || "$(jq -r .tag_name release.json)" != "$TAG" ]]; then
            echo "::error::Release did not become public with the expected tag; refusing JSON update."
            exit 1
          fi
          gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$TAG" > published-tag.json
          python scripts/timesaver_release_draft.py validate-tag-ref \
            --path published-tag.json --tag "$TAG"

          verify_public_asset() {
            local asset_name="$1"
            local expected_hash="$2"
            local expected_bytes="$3"
            local url="https://github.com/$RELEASE_REPOSITORY/releases/download/$TAG/$asset_name"
            local output="public-$asset_name"
            for attempt in 1 2 3 4; do
              if curl --fail --silent --show-error --location "$url" --output "$output"; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "::error::Public download failed for $asset_name; update JSON remains unchanged."
                return 1
              fi
              sleep 5
            done
            local label="Public $asset_name"
            if [[ "$asset_name" == "$ASSET" ]]; then
              label="Public ZIP"
            else
              label="Public repair asset"
            fi
            python scripts/timesaver_release_assets.py verify "$output" "$expected_hash" "$expected_bytes" --label "$label"
          }

          verify_public_asset "$ASSET" "$EXPECTED_ZIP_SHA256" "$ZIP_BYTES"
          public_hash="$(sha256sum "public-$ASSET" | awk '{print toupper($1)}')"
          if [[ "$public_hash" != "${EXPECTED_ZIP_SHA256^^}" ]]; then
            echo "::error::Public ZIP SHA-256 mismatch; update JSON remains unchanged."
            exit 1
          fi
          if [[ "$REPAIR_ENABLED" == "true" ]]; then
            verify_public_asset "$REPAIR_ASSET_NAME" "$EXPECTED_REPAIR_SHA256" "$REPAIR_BYTES"
            repair_public_hash="$(sha256sum "public-$REPAIR_ASSET_NAME" | awk '{print toupper($1)}')"
            if [[ "$repair_public_hash" != "${EXPECTED_REPAIR_SHA256^^}" ]]; then
              echo "::error::Public repair asset SHA-256 mismatch; update JSON remains unchanged."
              exit 1
            fi
            echo "PUBLIC_REPAIR_ASSET_SHA256=$repair_public_hash"
          fi
          python - "public-$ASSET" "$EXPECTED_EXE_SHA256" "$EXPECTED_UPDATER_SHA256" <<'PY'
          import hashlib, sys, zipfile
          path, expected_exe, expected_updater = sys.argv[1:]
          with zipfile.ZipFile(path) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
              if len(names) != 2 or set(names) != {"TIMESAVER.exe", "Updater.exe"}:
                  raise SystemExit("Public ZIP has unexpected entries.")
              if archive.testzip() is not None:
                  raise SystemExit("Public ZIP failed CRC validation.")
              if hashlib.sha256(archive.read("TIMESAVER.exe")).hexdigest() != expected_exe.lower():
                  raise SystemExit("Public TIMESAVER.exe hash mismatch.")
              if hashlib.sha256(archive.read("Updater.exe")).hexdigest() != expected_updater.lower():
                  raise SystemExit("Public Updater.exe hash mismatch.")
          PY
          echo "release_url=https://github.com/$RELEASE_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "public_zip_sha256=$public_hash" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_ZIP_SHA256=$public_hash"
      - name: Update or verify update JSON after public ZIP validation
        id: update_json
        shell: bash
        env:
          VERSION: ${{ steps.release_request.outputs.version }}
          RELEASE_NOTES: ${{ steps.release_request.outputs.release_notes }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          ZIP_SHA256: ${{ steps.release.outputs.public_zip_sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPOSITORY/contents/TIMESAVER_update.json?ref=main" > current-json-response.json
          OLD_COMMIT="$(gh api "repos/$RELEASE_REPOSITORY/commits?path=TIMESAVER_update.json&per_page=1" --jq '.[0].sha')"
          export OLD_COMMIT
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          def version_tuple(value):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value or ""):
                  raise SystemExit("Existing or requested version is not valid X.Y.Z.")
              return tuple(map(int, value.split(".")))

          response = json.loads(Path("current-json-response.json").read_text(encoding="utf-8"))
          old_text = base64.b64decode(response["content"]).decode("utf-8")
          old = json.loads(old_text)
          version = os.environ["VERSION"]
          desired = {
              "app_id": "timesaver",
              "version": version,
              "download_url": os.environ["DOWNLOAD_URL"],
              "sha256": os.environ["ZIP_SHA256"].lower(),
              "release_notes": os.environ["RELEASE_NOTES"],
          }
          current_version = old.get("version")
          current_tuple = version_tuple(current_version)
          requested_tuple = version_tuple(version)
          Path("previous-update.json").write_text(old_text, encoding="utf-8")
          if current_tuple == requested_tuple:
              if old != desired:
                  raise SystemExit("Update JSON already has this version with different values; refusing overwrite.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("already_current=true\n")
                  out.write(f"blob_sha={response['sha']}\n")
              print("Update JSON already matches the verified Release; no commit needed.")
          else:
              if current_tuple > requested_tuple:
                  raise SystemExit("Existing update JSON is newer than this release; refusing downgrade.")
              Path("new-update.json").write_text(json.dumps(desired, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("already_current=false\n")
                  out.write(f"blob_sha={response['sha']}\n")
              summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
              summary.write_text(
                  "# TIMESAVER update JSON activation\n\n"
                  f"- Previous JSON commit: {os.environ.get('OLD_COMMIT', 'not recorded')}\n"
                  f"- Previous JSON blob: {response['sha']}\n"
                  f"- Previous version: {current_version}\n"
                  "- Previous content (also retained in Git history):\n\n"
                  "```json\n" + json.dumps(old, ensure_ascii=False, indent=2) + "\n```\n",
                  encoding="utf-8",
              )
              print(f"Recorded previous update JSON commit={os.environ.get('OLD_COMMIT', 'not recorded')} version={current_version}.")
          PY
          if [[ "$(cat "$GITHUB_OUTPUT" | tail -n 2 | grep -c '^already_current=true$' || true)" -eq 1 ]]; then
            echo "JSON_ALREADY_CURRENT=true"
          else
            BLOB_SHA="$(grep '^blob_sha=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"
            CONTENT="$(base64 -w0 new-update.json)"
            gh api --method PUT "repos/$RELEASE_REPOSITORY/contents/TIMESAVER_update.json" \
              -f message="chore: publish TIMESAVER $VERSION update metadata" \
              -f content="$CONTENT" -f sha="$BLOB_SHA" -f branch=main > update-commit.json
            echo "JSON_COMMIT=$(jq -r '.commit.sha' update-commit.json)"
          fi
      - name: Verify public update JSON and update endpoint
        shell: bash
        env:
          VERSION: ${{ steps.release_request.outputs.version }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          ZIP_SHA256: ${{ steps.release.outputs.public_zip_sha256 }}
          RELEASE_NOTES: ${{ steps.release_request.outputs.release_notes }}
        run: |
          set -euo pipefail
          RAW_URL="https://raw.githubusercontent.com/$RELEASE_REPOSITORY/main/TIMESAVER_update.json"
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --location "$RAW_URL" --output final-update.json; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("final-update.json").read_text(encoding="utf-8"))
          expected = {
              "app_id": "timesaver",
              "version": os.environ["VERSION"],
              "download_url": os.environ["DOWNLOAD_URL"],
              "sha256": os.environ["ZIP_SHA256"].lower(),
              "release_notes": os.environ["RELEASE_NOTES"],
          }
          if data != expected:
              raise SystemExit("Public JSON does not exactly match the validated release.")
          print("PUBLIC_UPDATE_JSON=PASS")
          PY
              then
                exit 0
              fi
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error::Public update JSON verification failed."
              exit 1
            fi
            sleep 5
          done
